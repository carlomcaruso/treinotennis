name: Sincronizar planilha do Dropbox

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-planilha
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install openpyxl requests

      - name: Ler planilha e regenerar data.js
        env:
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python3 scripts/sync_dropbox.py

      - name: Publicar se houve mudança
        run: |
          if [ -n "$(git status --porcelain data.js sw.js)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js sw.js
            git commit -m "Sincroniza planilha ($(date +%d/%m/%Y))"
            git push
            echo "Publicado."
          else
            echo "Nada mudou na planilha."
          fi
